site_name: Cálculo de integrales por el método de Cuadratura Gaussiana

theme:
  name: "material"

plugins:
  - mkdocstrings

nav:
  - index.md
  - explanation.md
  - tutorials.md
  - reference.md

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - def_list
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js


